[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media_analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "gigachat>=0.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
media-analyzer = "api:main"

[tool.setuptools]
py-modules = [
    "agent",
    "api",
    "app",
    "cache",
    "config",
    "llm",
    "main",
    "parser",
    "services",
    "ui",
]

[tool.vercel]
entrypoint = "api:app"