[project]
name = "media-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "gigachat>=0.2.1",
    "langchain-gigachat",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools]
py-modules = [
    "api",
    "agent",
    "app",
    "cache",
    "config",
    "llm",
    "main",
    "parser",
    "services",
    "themes",
    "ui",
    "dashboard",
]